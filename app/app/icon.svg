<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    A mark rather than a letter.

    Three bars of growing length, each one starting where the last ended: the
    accumulator, which is the only idea in this product that needed a picture.
    It reads at sixteen pixels, which a monogram at this weight would not.
  -->
  <rect width="64" height="64" rx="14" fill="#0b0d10"/>
  <rect x="14" y="17" width="14" height="6" rx="3" fill="#6b7280"/>
  <rect x="14" y="29" width="24" height="6" rx="3" fill="#99a0ab"/>
  <rect x="14" y="41" width="36" height="6" rx="3" fill="#3fb950"/>
</svg>
