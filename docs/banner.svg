<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-label="Probatio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1310"/>
      <stop offset="0.55" stop-color="#080e0b"/>
      <stop offset="1" stop-color="#060a08"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fe08a"/>
      <stop offset="1" stop-color="#1d7a4a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.28" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#3fe08a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3fe08a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#3fe08a" opacity="0.05"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>.m{font-family:'SFMono-Regular','JetBrains Mono','Fira Mono',ui-monospace,monospace}</style>
  </defs>

  <rect x="6" y="6" width="1188" height="308" rx="18" fill="url(#bg)" stroke="#18271f" stroke-width="1.5"/>
  <rect x="6" y="6" width="1188" height="308" rx="18" fill="url(#dots)"/>
  <rect x="6" y="6" width="1188" height="308" rx="18" fill="url(#halo)"/>

  <!-- window chrome -->
  <g transform="translate(44,50)">
    <circle cx="0" cy="0" r="6" fill="#ff5f56"/>
    <circle cx="22" cy="0" r="6" fill="#ffbd2e"/>
    <circle cx="44" cy="0" r="6" fill="#3fe08a"/>
    <text class="m" x="80" y="5" fill="#4f6157" font-size="13">probatio</text>
    <text class="m" x="152" y="5" fill="#2f3d36" font-size="13">main</text>
  </g>

  <!-- wordmark with green halo -->
  <text class="m" x="42" y="158" font-size="74" font-weight="800" letter-spacing="3" fill="#3fe08a" opacity="0.55" filter="url(#glow)">PROBATIO</text>
  <text class="m" x="42" y="158" font-size="74" font-weight="800" letter-spacing="3" fill="#f2fff8">PROBATIO</text>

  <!-- accent bar with a moving highlight -->
  <rect x="44" y="178" width="392" height="3" rx="1.5" fill="#18332a"/>
  <rect x="44" y="178" width="150" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="x" values="44;286;44" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- tagline -->
  <g class="m" transform="translate(44,214)" font-size="18">
    <text fill="#3fe08a">$</text>
    <text x="20" fill="#c7d6cd">trade fake money on real tokens, prove you're good</text>
    <rect x="512" y="-15" width="10" height="20" fill="#3fe08a">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- feature chips -->
  <g class="m" font-size="12.5" transform="translate(44,254)">
    <g>
      <rect x="0" y="0" width="118" height="27" rx="13.5" fill="#0e1913" stroke="#254a38"/>
      <text x="59" y="18" text-anchor="middle" fill="#8fc9ac">honest fills</text>
    </g>
    <g transform="translate(130,0)">
      <rect x="0" y="0" width="168" height="27" rx="13.5" fill="#0e1913" stroke="#254a38"/>
      <text x="84" y="18" text-anchor="middle" fill="#8fc9ac">tamper-evident records</text>
    </g>
    <g transform="translate(310,0)">
      <rect x="0" y="0" width="140" height="27" rx="13.5" fill="#0e1913" stroke="#254a38"/>
      <text x="70" y="18" text-anchor="middle" fill="#8fc9ac">ranked seasons</text>
    </g>
    <g transform="translate(462,0)">
      <rect x="0" y="0" width="98" height="27" rx="13.5" fill="#0e1913" stroke="#254a38"/>
      <text x="49" y="18" text-anchor="middle" fill="#8fc9ac">AI coach</text>
    </g>
  </g>

  <!-- right: the record, as an on-chain hash-chain -->
  <g transform="translate(742,92)">
    <text class="m" x="0" y="0" fill="#4f6157" font-size="12.5" letter-spacing="1">EVERY TRADE, FOLDED INTO 32 BYTES ON CHAIN</text>

    <!-- connectors -->
    <g stroke="#2a5f45" stroke-width="2">
      <line x1="96" y1="46" x2="120" y2="46"/>
      <line x1="216" y1="46" x2="240" y2="46"/>
      <line x1="336" y1="46" x2="360" y2="46"/>
    </g>

    <!-- blocks -->
    <g class="m" font-size="12" text-anchor="middle">
      <g transform="translate(0,20)">
        <rect width="96" height="52" rx="9" fill="#0d1712" stroke="#2a5f45"/>
        <text x="48" y="24" fill="#5b6b62" font-size="10">root</text>
        <text x="48" y="41" fill="#3fe08a">a1f9c4</text>
      </g>
      <g transform="translate(120,20)">
        <rect width="96" height="52" rx="9" fill="#0d1712" stroke="#2a5f45"/>
        <text x="48" y="24" fill="#5b6b62" font-size="10">root</text>
        <text x="48" y="41" fill="#3fe08a">3c07be</text>
      </g>
      <g transform="translate(240,20)">
        <rect width="96" height="52" rx="9" fill="#0d1712" stroke="#2a5f45"/>
        <text x="48" y="24" fill="#5b6b62" font-size="10">root</text>
        <text x="48" y="41" fill="#3fe08a">e2705a</text>
      </g>
      <g transform="translate(360,20)">
        <rect width="96" height="52" rx="9" fill="#0e211a" stroke="#3fe08a"/>
        <text x="48" y="24" fill="#5b6b62" font-size="10">on chain</text>
        <text x="48" y="41" fill="#eafff5">9d4b17</text>
      </g>
    </g>

    <!-- pulse travelling the chain -->
    <circle cy="46" r="4" fill="#3fe08a" filter="url(#glow)">
      <animate attributeName="cx" values="48;168;288;408" keyTimes="0;0.33;0.66;1" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;1;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>

    <text class="m" x="0" y="104" fill="#54655c" font-size="12.5">acc = sha256( acc, root, leaves, version )</text>
    <text class="m" x="0" y="126" fill="#3a4842" font-size="12">edit one old trade and every value after it changes.</text>
  </g>
</svg>
