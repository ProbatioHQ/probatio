<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" fill="none" role="img" aria-label="Probatio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1310"/>
      <stop offset="0.55" stop-color="#080e0b"/>
      <stop offset="1" stop-color="#060a08"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fe08a"/>
      <stop offset="1" stop-color="#1d7a4a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.24" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#3fe08a" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#3fe08a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#3fe08a" opacity="0.05"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>.m{font-family:'SFMono-Regular','JetBrains Mono','Fira Mono',ui-monospace,monospace}</style>
  </defs>

  <rect x="6" y="6" width="1188" height="208" rx="18" fill="url(#bg)" stroke="#18271f" stroke-width="1.5"/>
  <rect x="6" y="6" width="1188" height="208" rx="18" fill="url(#dots)"/>
  <rect x="6" y="6" width="1188" height="208" rx="18" fill="url(#halo)"/>

  <!-- window chrome -->
  <g transform="translate(48,44)">
    <circle cx="0" cy="0" r="6" fill="#ff5f56"/>
    <circle cx="22" cy="0" r="6" fill="#ffbd2e"/>
    <circle cx="44" cy="0" r="6" fill="#3fe08a"/>
    <text class="m" x="82" y="5" fill="#4f6157" font-size="13">probatio</text>
    <text class="m" x="156" y="5" fill="#2f3d36" font-size="13">main</text>
  </g>

  <!-- wordmark with green halo -->
  <text class="m" x="46" y="140" font-size="72" font-weight="800" letter-spacing="3" fill="#3fe08a" opacity="0.5" filter="url(#glow)">PROBATIO</text>
  <text class="m" x="46" y="140" font-size="72" font-weight="800" letter-spacing="3" fill="#f2fff8">PROBATIO</text>

  <!-- accent bar with a moving highlight -->
  <rect x="48" y="160" width="470" height="3" rx="1.5" fill="#18332a"/>
  <rect x="48" y="160" width="170" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="x" values="48;348;48" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- tagline -->
  <g class="m" transform="translate(48,196)" font-size="18">
    <text fill="#3fe08a">$</text>
    <text x="20" fill="#c7d6cd">trade fake money on real tokens, prove you're good</text>
    <rect x="513" y="-15" width="10" height="20" fill="#3fe08a">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
