<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-label="Probatio: the open prop firm">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a100d"/>
      <stop offset="1" stop-color="#070b09"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fe08a"/>
      <stop offset="1" stop-color="#1d7a4a"/>
    </linearGradient>
    <style>
      .mono { font-family: 'SFMono-Regular', 'JetBrains Mono', 'Fira Mono', ui-monospace, monospace; }
    </style>
  </defs>

  <!-- card -->
  <rect x="8" y="8" width="1184" height="304" rx="14" fill="url(#bg)" stroke="#1c2b22" stroke-width="1.5"/>

  <!-- faint hex texture -->
  <g class="mono" opacity="0.05" font-size="13" letter-spacing="2">
    <text x="40" y="40" fill="#3fe08a">6f 70 65 6e 20 70 72 6f 70 20 66 69 72 6d 20 2e 20 68 6f 6e 65 73 74 20 66 69 6c 6c 73</text>
    <text x="40" y="292" fill="#3fe08a">73 68 61 32 35 36 28 61 63 63 20 e2 80 96 20 72 6f 6f 74 20 e2 80 96 20 6c 65 61 76 65 73 29</text>
  </g>

  <!-- window chrome -->
  <g transform="translate(40,64)">
    <circle cx="0" cy="0" r="6" fill="#ff5f56"/>
    <circle cx="22" cy="0" r="6" fill="#ffbd2e"/>
    <circle cx="44" cy="0" r="6" fill="#3fe08a"/>
    <text class="mono" x="78" y="5" fill="#5b6b62" font-size="14">~/probatio</text>
  </g>

  <!-- title -->
  <text class="mono" x="40" y="168" fill="#e9fff4" font-size="76" font-weight="800" letter-spacing="2">PROBATIO</text>

  <!-- accent underline -->
  <rect x="42" y="188" width="360" height="4" rx="2" fill="url(#accent)"/>

  <!-- prompt line with blinking cursor -->
  <g class="mono" transform="translate(40,238)" font-size="20">
    <text fill="#3fe08a">$</text>
    <text x="24" fill="#c9d6cf">trade fake money on real tokens, prove you're good</text>
    <rect x="588" y="-16" width="11" height="22" fill="#3fe08a">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- subtitle -->
  <text class="mono" x="40" y="278" fill="#6b7f74" font-size="15" letter-spacing="1">
    the open prop firm . honest fills . every trade committed to Solana . checkable by anyone
  </text>

  <!-- right column: the accumulator, the product's whole argument -->
  <g class="mono" transform="translate(1160,120)" text-anchor="end" font-size="13" opacity="0.85">
    <text y="0"  fill="#5b6b62">on chain, 32 bytes:</text>
    <text y="26" fill="#3fe08a">accumulator =</text>
    <text y="48" fill="#8fb3a2">sha256(</text>
    <text y="70" fill="#8fb3a2">  acc, root,</text>
    <text y="92" fill="#8fb3a2">  leaves, version</text>
    <text y="114" fill="#8fb3a2">)</text>
    <text y="150" fill="#5b6b62">edit one old trade,</text>
    <text y="168" fill="#5b6b62">every value after</text>
    <text y="186" fill="#5b6b62">it changes.</text>
  </g>
</svg>
